name: Local CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: http://localhost:4000
  UI_BASE_URL: http://localhost:3000
  TEST_PASSWORD: TestPassword123!
  RUN_FAILURE_DEMO: "false"

jobs:
  test:
    name: API and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Check out demo application
        uses: actions/checkout@v5
        with:
          repository: okryvorotko/car-shop-demo
          ref: master
          path: application

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm

      - name: Set up Java for Allure
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and start demo application
        working-directory: application
        run: docker compose up --build --detach

      - name: Wait for application
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 5 "$API_BASE_URL/ping" >/dev/null \
              && curl --fail --silent --show-error --max-time 5 "$UI_BASE_URL" >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application ($attempt/30)..."
            sleep 5
          done
          echo "Application did not become ready" >&2
          exit 1

      - name: Run API and UI tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: Generate Allure report
        if: always() && hashFiles('allure-results/**') != ''
        run: npm run report:allure

      - name: Capture application logs
        if: steps.tests.outcome == 'failure'
        working-directory: application
        run: docker compose logs --no-color > ../docker-compose.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-ci-test-results
          path: |
            allure-report/
            allure-results/
            test-results/
            docker-compose.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop demo application
        if: always()
        working-directory: application
        run: docker compose down --volumes --remove-orphans

      - name: Fail job when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
