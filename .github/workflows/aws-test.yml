name: AWS deployment tests

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: car-shop-demo branch or tag
        required: true
        default: master
      run_failure_demo:
        description: Run one intentionally failing UI test to verify report artifacts
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize infrastructure runs because Terraform state is passed between jobs.
  group: aws-test-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_run_id: ${{ github.run_id }}-${{ github.run_attempt }}
  TF_VAR_app_ref: ${{ inputs.app_ref || 'master' }}
  RUN_FAILURE_DEMO: ${{ inputs.run_failure_demo || 'false' }}

jobs:
  prepare_infra:
    name: Prepare infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      ui_base_url: ${{ steps.urls.outputs.ui_base_url }}
      api_base_url: ${{ steps.urls.outputs.api_base_url }}

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TF_VAR_aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Deploy application
        id: deploy
        continue-on-error: true
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Save deployment URLs
        id: urls
        if: steps.deploy.outcome == 'success'
        working-directory: terraform
        shell: bash
        run: |
          echo "ui_base_url=$(terraform output -raw ui_url)" >> "$GITHUB_OUTPUT"
          echo "api_base_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"

      - name: Upload Terraform state
        if: always() && hashFiles('terraform/terraform.tfstate') != ''
        uses: actions/upload-artifact@v6
        with:
          name: terraform-state-${{ github.run_id }}
          path: terraform/terraform.tfstate
          if-no-files-found: error
          retention-days: 1

      - name: Wait for application
        if: steps.deploy.outcome == 'success'
        env:
          UI_BASE_URL: ${{ steps.urls.outputs.ui_base_url }}
          API_BASE_URL: ${{ steps.urls.outputs.api_base_url }}
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 5 "$API_BASE_URL/ping" >/dev/null && curl --fail --silent --show-error --max-time 5 "$UI_BASE_URL" >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application ($attempt/60)..."
            sleep 10
          done
          echo "Application did not become ready in 10 minutes" >&2
          exit 1

      - name: Fail when deployment failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1

  ui_tests:
    name: Running UI tests
    needs: prepare_infra
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        id: tests
        continue-on-error: true
        env:
          UI_BASE_URL: ${{ needs.prepare_infra.outputs.ui_base_url }}
          API_BASE_URL: ${{ needs.prepare_infra.outputs.api_base_url }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPassword123!' }}
        run: npm run test:ui

      - name: Upload UI test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ui-test-results-${{ github.run_id }}
          path: |
            allure-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail job when UI tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  api_tests:
    name: Running API tests
    needs: prepare_infra
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: npm ci

      - name: Run API tests
        id: tests
        continue-on-error: true
        env:
          UI_BASE_URL: ${{ needs.prepare_infra.outputs.ui_base_url }}
          API_BASE_URL: ${{ needs.prepare_infra.outputs.api_base_url }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPassword123!' }}
        run: npm run test:api

      - name: Upload API test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-test-results-${{ github.run_id }}
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Fail job when API tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  terminate_infra:
    name: Terminate infra
    needs: [prepare_infra, ui_tests, api_tests]
    if: always() && needs.prepare_infra.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Download Terraform state
        id: state
        continue-on-error: true
        uses: actions/download-artifact@v6
        with:
          name: terraform-state-${{ github.run_id }}
          path: terraform

      - name: Configure AWS credentials
        if: steps.state.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TF_VAR_aws_region }}

      - name: Set up Terraform
        if: steps.state.outcome == 'success'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        if: steps.state.outcome == 'success'
        working-directory: terraform
        run: terraform init

      - name: Destroy AWS infrastructure
        if: steps.state.outcome == 'success'
        working-directory: terraform
        run: terraform destroy -auto-approve

      - name: Fail when Terraform state is unavailable
        if: steps.state.outcome == 'failure' && needs.prepare_infra.result == 'success'
        run: exit 1

  generate_report:
    name: Generate report
    needs: [prepare_infra, ui_tests, api_tests, terminate_infra]
    if: always() && (needs.ui_tests.result != 'skipped' || needs.api_tests.result != 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: npm ci

      - name: Set up Java for Allure
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download test results
        uses: actions/download-artifact@v6
        with:
          pattern: '*-test-results-${{ github.run_id }}'
          path: downloaded-results
          merge-multiple: false

      - name: Merge Allure results
        shell: bash
        run: |
          mkdir -p allure-results test-results
          find downloaded-results -type f -path '*/allure-results/*' -exec cp {} allure-results/ \;
          if [ -d "downloaded-results/api-test-results-${{ github.run_id }}" ]; then
            find "downloaded-results/api-test-results-${{ github.run_id }}" -maxdepth 1 -type f -exec cp {} allure-results/ \;
          fi
          if find downloaded-results -type f -path '*/test-results/*' -print -quit | grep -q .; then
            cp -R downloaded-results/ui-test-results-${{ github.run_id }}/test-results/. test-results/
          fi
          {
            echo "Application.ref=$TF_VAR_app_ref"
            echo "AWS.region=$TF_VAR_aws_region"
            echo "Browser=Chromium"
            echo "GitHub.run=$GITHUB_RUN_NUMBER"
          } > allure-results/environment.properties

      - name: Generate Allure HTML report
        run: npm run report:allure

      - name: Upload report for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
          retention-days: 1

      - name: Upload Allure report
        id: allure_artifact
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-${{ github.run_id }}
          path: |
            allure-report/
            allure-results/
            test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add report links to job summary
        shell: bash
        run: |
          {
            echo "## Test report"
            echo
            echo "[Open the latest test report](${{ steps.deployment.outputs.page_url }})"
            echo
            echo "[Download the Allure HTML report](${{ steps.allure_artifact.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow when tests or cleanup failed
        if: needs.ui_tests.result == 'failure' || needs.api_tests.result == 'failure' || needs.terminate_infra.result == 'failure'
        run: exit 1
