name: AWS deployment tests

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: car-shop-demo branch or tag
        required: true
        default: master
      run_failure_demo:
        description: Run one intentionally failing UI test to verify report artifacts
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize every infrastructure run in this repository. A later run waits
  # instead of touching AWS while an earlier Terraform state is still active.
  group: aws-test-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy-test-destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      pages_artifact_id: ${{ steps.pages_artifact.outputs.artifact_id }}
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      TF_VAR_run_id: ${{ github.run_id }}-${{ github.run_attempt }}
      TF_VAR_app_ref: ${{ inputs.app_ref || 'master' }}
      RUN_FAILURE_DEMO: ${{ inputs.run_failure_demo || 'false' }}

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TF_VAR_aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: terraform
        run: terraform init

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Deploy application
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Read deployment URLs
        working-directory: terraform
        run: |
          echo "UI_BASE_URL=$(terraform output -raw ui_url)" >> "$GITHUB_ENV"
          echo "API_BASE_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"

      - name: Wait for application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 5 "$API_BASE_URL/ping" >/dev/null && curl --fail --silent --show-error --max-time 5 "$UI_BASE_URL" >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application ($attempt/60)..."
            sleep 10
          done
          echo "Application did not become ready in 10 minutes" >&2
          exit 1

      - name: Install test dependencies
        run: npm ci

      - name: Set up Java for Allure
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run API tests
        id: api_tests
        continue-on-error: true
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPassword123!' }}
        run: npm run test:api

      - name: Run UI tests
        id: ui_tests
        if: always() && steps.api_tests.outcome != 'skipped'
        continue-on-error: true
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPassword123!' }}
        run: npm run test:ui

      - name: Add report environment
        if: always() && steps.api_tests.outcome != 'skipped'
        shell: bash
        run: |
          mkdir -p allure-results
          {
            echo "Application.ref=$TF_VAR_app_ref"
            echo "AWS.region=$TF_VAR_aws_region"
            echo "Browser=Chromium"
            echo "GitHub.run=$GITHUB_RUN_NUMBER"
          } > allure-results/environment.properties

      - name: Generate Allure HTML report
        if: always() && steps.api_tests.outcome != 'skipped'
        run: npm run report:allure

      - name: Upload report for GitHub Pages
        id: pages_artifact
        if: always() && hashFiles('allure-report/index.html') != ''
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
          retention-days: 1

      - name: Upload Allure report
        id: allure_artifact
        if: always() && steps.api_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-${{ github.run_id }}
          path: |
            allure-report/
            allure-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Add report link to job summary
        if: always() && steps.allure_artifact.outputs.artifact-url != ''
        shell: bash
        run: |
          {
            echo "## Test report"
            echo
            echo "[Download the Allure HTML report](${{ steps.allure_artifact.outputs.artifact-url }})"
            echo
            echo "Download and extract the artifact, then run \`npx allure open allure-report\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow when tests failed
        if: always() && (steps.api_tests.outcome == 'failure' || steps.ui_tests.outcome == 'failure')
        run: exit 1

      - name: Destroy AWS infrastructure
        if: always()
        working-directory: terraform
        run: terraform destroy -auto-approve

  publish-report:
    name: Publish Allure report
    needs: deploy-test-destroy
    if: always() && needs.deploy-test-destroy.outputs.pages_artifact_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add Pages link to job summary
        shell: bash
        run: |
          {
            echo "## Published Allure report"
            echo
            echo "[Open the latest test report](${{ steps.deployment.outputs.page_url }})"
          } >> "$GITHUB_STEP_SUMMARY"
