name: AWS deployment tests

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: car-shop-demo branch or tag
        required: true
        default: master
      run_failure_demo:
        description: Run one intentionally failing UI test to verify report artifacts
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aws-test-${{ github.repository }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_run_id: ${{ github.run_id }}-${{ github.run_attempt }}
  TF_VAR_app_ref: ${{ inputs.app_ref || 'master' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_REGION: ${{ vars.TF_STATE_REGION || 'us-east-1' }}
  TF_STATE_KEY: test-car-shop/runs/${{ github.run_id }}-${{ github.run_attempt }}/terraform.tfstate
  RUN_FAILURE_DEMO: ${{ inputs.run_failure_demo || 'false' }}

jobs:
  test_on_aws:
    name: Deploy, test, and destroy
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      tests_outcome: ${{ steps.tests.outcome }}

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.TF_VAR_aws_region }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Set Terraform runtime values
        shell: bash
        run: |
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "Repository variable TF_STATE_BUCKET is required." >&2
            exit 1
          fi

          runner_ip="$(curl --fail --silent --show-error https://checkip.amazonaws.com | tr -d '[:space:]')"
          if ! [[ "$runner_ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Could not determine a valid runner IPv4 address." >&2
            exit 1
          fi

          echo "TF_VAR_allowed_cidr=${runner_ip}/32" >> "$GITHUB_ENV"
          echo "TF_VAR_expires_at=$(date -u -d '+4 hours' '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Initialize Terraform
        id: init
        working-directory: terraform
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: terraform
        run: terraform validate

      - name: Deploy application
        id: deploy
        continue-on-error: true
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Read deployment URLs
        if: steps.deploy.outcome == 'success'
        working-directory: terraform
        shell: bash
        run: |
          echo "UI_BASE_URL=$(terraform output -raw ui_url)" >> "$GITHUB_ENV"
          echo "API_BASE_URL=$(terraform output -raw api_url)" >> "$GITHUB_ENV"

      - name: Wait for application
        id: readiness
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --max-time 5 "$API_BASE_URL/ping" >/dev/null \
              && curl --fail --silent --show-error --max-time 5 "$UI_BASE_URL" >/dev/null; then
              echo "Application is ready"
              exit 0
            fi
            echo "Waiting for application ($attempt/60)..."
            sleep 10
          done
          echo "Application did not become ready in 10 minutes" >&2
          exit 1

      - name: Run API and UI tests
        id: tests
        if: steps.readiness.outcome == 'success'
        continue-on-error: true
        env:
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'TestPassword123!' }}
        run: npm test

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: aws-test-results-${{ github.run_id }}
          path: |
            allure-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Destroy AWS infrastructure
        id: destroy
        if: always() && steps.init.outcome == 'success'
        continue-on-error: true
        working-directory: terraform
        run: terraform destroy -auto-approve

      - name: Fail when deployment, readiness, tests, or teardown failed
        if: >-
          always() &&
          (steps.deploy.outcome == 'failure' ||
          steps.readiness.outcome == 'failure' ||
          steps.tests.outcome == 'failure' ||
          steps.destroy.outcome == 'failure')
        run: exit 1

  generate_report:
    name: Generate report
    needs: test_on_aws
    if: >-
      always() &&
      needs.test_on_aws.outputs.tests_outcome != '' &&
      needs.test_on_aws.outputs.tests_outcome != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out test framework
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Set up Java for Allure
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download test results
        uses: actions/download-artifact@v6
        with:
          name: aws-test-results-${{ github.run_id }}
          path: downloaded-results

      - name: Prepare Allure results
        shell: bash
        run: |
          mkdir -p allure-results test-results
          cp -R downloaded-results/allure-results/. allure-results/
          if [ -d downloaded-results/test-results ]; then
            cp -R downloaded-results/test-results/. test-results/
          fi
          {
            echo "Application.ref=$TF_VAR_app_ref"
            echo "AWS.region=$TF_VAR_aws_region"
            echo "Browser=Chromium"
            echo "GitHub.run=$GITHUB_RUN_NUMBER"
          } > allure-results/environment.properties

      - name: Generate Allure HTML report
        run: npm run report:allure

      - name: Restore previously published reports
        id: history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages-site

      - name: Initialize report history
        if: steps.history.outcome == 'failure'
        shell: bash
        run: |
          mkdir -p pages-site
          git -C pages-site init --initial-branch=gh-pages

      - name: Add this run to the report history
        run: node scripts/build-pages-history.mjs allure-report allure-results pages-site

      - name: Save report history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git -C pages-site config user.name github-actions[bot]
          git -C pages-site config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C pages-site add .
          git -C pages-site commit -m "Publish test report for run $GITHUB_RUN_NUMBER (attempt $GITHUB_RUN_ATTEMPT)"
          git -C pages-site push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
          rsync -a --exclude=.git pages-site/ pages-public/

      - name: Upload report for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-public
          retention-days: 1

      - name: Upload Allure report
        id: allure_artifact
        uses: actions/upload-artifact@v6
        with:
          name: allure-report-${{ github.run_id }}
          path: |
            allure-report/
            allure-results/
            test-results/
          if-no-files-found: error
          retention-days: 7

      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Add report links to job summary
        shell: bash
        run: |
          {
            echo "## Test report"
            echo
            echo "[Open test report history](${{ steps.deployment.outputs.page_url }})"
            echo
            echo "[Download the Allure HTML report](${{ steps.allure_artifact.outputs.artifact-url }})"
          } >> "$GITHUB_STEP_SUMMARY"
